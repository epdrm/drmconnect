   name: Criar issues
   on:
     workflow_dispatch:
       inputs:
         run:
           description: "Criar de verdade? (desmarcado = simulação)"
           type: boolean
           default: false
   permissions:
     issues: write
     contents: read
   jobs:
     criar:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Rodar script
           env:
             GH_TOKEN: ${{ github.token }}
           run: |
             if [ "${{ inputs.run }}" = "true" ]; then
               python3 scripts/criar_issues_drmconnect.py --repo "${{ github.repository }}" --run
             else
               python3 scripts/criar_issues_drmconnect.py --repo "${{ github.repository }}"
             fi
